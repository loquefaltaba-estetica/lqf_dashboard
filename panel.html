<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Montserrat",sans-serif;background:linear-gradient(135deg,#061e1e 0%,#0a3d38 40%,#0d5e55 70%,#0a4a4a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#f0faf9;overflow:hidden;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(46,203,184,0.1) 0%,transparent 60%);pointer-events:none;}

.login-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:0;width:100%;max-width:380px;padding:24px;}

/* Logo flotante */
.login-logo{width:90px;height:90px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px rgba(46,203,184,0.25),0 0 32px rgba(46,203,184,0.4),0 0 64px rgba(46,203,184,0.12);margin-bottom:22px;animation:flotar 3s ease-in-out infinite;}
.login-titulo{font-family:"Playfair Display",serif;font-size:30px;font-weight:900;letter-spacing:2px;text-transform:uppercase;text-align:center;color:#f0faf9;line-height:1;}
.login-titulo em{font-style:italic;color:#2ecbb8;}
.login-sub{font-family:"Bebas Neue",cursive;font-size:11px;letter-spacing:4px;color:#7aada8;text-transform:uppercase;text-align:center;margin-top:6px;margin-bottom:28px;}
.login-div{width:60px;height:1px;background:linear-gradient(90deg,transparent,#2ecbb8,transparent);margin:0 auto 28px;}

.login-box{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(46,203,184,0.18);border-radius:18px;padding:32px 28px;backdrop-filter:blur(14px);box-shadow:0 0 60px rgba(46,203,184,0.07);position:relative;overflow:hidden;}
.login-box::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#2ecbb8,transparent);}

.field-wrap{position:relative;margin-bottom:16px;}
.field-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#2ecbb8;margin-bottom:7px;display:block;}
.field-input{width:100%;padding:13px 44px 13px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(46,203,184,0.22);border-radius:10px;color:#f0faf9;font-family:"Montserrat",sans-serif;font-size:13px;font-weight:500;letter-spacing:1px;outline:none;transition:border-color 0.2s;}
.field-input:focus{border-color:rgba(46,203,184,0.6);}
.field-input.err{border-color:rgba(224,108,108,0.7);animation:shake 0.35s ease;}
.field-input::placeholder{color:rgba(122,173,168,0.35);letter-spacing:0;}
.toggle-eye{position:absolute;right:13px;bottom:13px;background:none;border:none;cursor:pointer;color:#7aada8;display:flex;align-items:center;transition:color 0.2s;}
.toggle-eye:hover{color:#4de8d4;}
.toggle-eye svg{width:16px;height:16px;}

.login-err{font-size:10px;color:#e06c6c;letter-spacing:1px;font-weight:700;text-transform:uppercase;min-height:16px;text-align:center;margin-bottom:4px;}

.btn-login{width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,#0d7c72,#2ecbb8);color:#061a1a;font-weight:700;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;border:none;cursor:pointer;box-shadow:0 0 20px rgba(46,203,184,0.35);transition:all 0.2s;margin-top:4px;}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(46,203,184,0.5);}
.btn-login:active{transform:translateY(0);}

.login-back{margin-top:20px;text-align:center;}
.login-back a{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(122,173,168,0.5);text-decoration:none;transition:color 0.2s;}
.login-back a:hover{color:#4de8d4;}

/* Intentos fallidos */
.lock-msg{display:none;text-align:center;padding:14px;background:rgba(224,108,108,0.08);border:1px solid rgba(224,108,108,0.25);border-radius:10px;margin-bottom:16px;font-size:11px;color:#e06c6c;font-weight:600;letter-spacing:0.5px;line-height:1.6;}

@keyframes flotar{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.login-wrap{animation:fadeIn 0.6s ease both;}
</style>
</head>

  <div class="login-titulo">Lo Que <em>Faltaba</em></div>
  <div class="login-sub">Área restringida · Personal</div>
  <div class="login-div"></div>

  <div class="login-box">
    <div class="lock-msg" id="lockMsg"></div>

    <label class="field-label">Contraseña</label>
    <div class="field-wrap">
      <input class="field-input" type="password" id="passInput" placeholder="••••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')verificar()">
      <button class="toggle-eye" type="button" onclick="toggleEye()">
        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <div class="login-err" id="loginErr"></div>
    <button class="btn-login" onclick="verificar()">Ingresar al panel</button>
  </div>

  <div class="login-back"><a href="index.html">← Volver al inicio</a></div>
</div>

<script>
// Contraseña configurable acá
const PASS = "MiaBenito";
const PANEL_URL = "dashboard.html";
const MAX_INT = 5;
const LOCK_MIN = 10;

let intentos = parseInt(sessionStorage.getItem("lqf_int") || "0");
let bloqueado = false;

function checkBloqueo() {
  const hasta = parseInt(sessionStorage.getItem("lqf_lock") || "0");
  if (Date.now() < hasta) {
    const min = Math.ceil((hasta - Date.now()) / 60000);
    mostrarBloqueo(min);
    return true;
  }
  return false;
}

function mostrarBloqueo(min) {
  bloqueado = true;
  const el = document.getElementById("lockMsg");
  el.style.display = "block";
  el.textContent = "Demasiados intentos fallidos. Intentá de nuevo en " + min + " minuto" + (min !== 1 ? "s" : "") + ".";
  document.getElementById("passInput").disabled = true;
  document.querySelector(".btn-login").disabled = true;
  document.querySelector(".btn-login").style.opacity = "0.4";
}

function verificar() {
  if (bloqueado || checkBloqueo()) return;
  const inp = document.getElementById("passInput");
  const err = document.getElementById("loginErr");
  if (inp.value === PASS) {
    sessionStorage.removeItem("lqf_int");
    sessionStorage.removeItem("lqf_lock");
    err.textContent = "";
    inp.style.borderColor = "rgba(123,207,123,0.6)";
    setTimeout(() => { window.location.href = PANEL_URL; }, 400);
  } else {
    intentos++;
    sessionStorage.setItem("lqf_int", intentos);
    inp.classList.add("err");
    inp.value = "";
    setTimeout(() => inp.classList.remove("err"), 400);
    const rest = MAX_INT - intentos;
    if (intentos >= MAX_INT) {
      const hasta = Date.now() + LOCK_MIN * 60 * 1000;
      sessionStorage.setItem("lqf_lock", hasta);
      mostrarBloqueo(LOCK_MIN);
    } else {
      err.textContent = "Contraseña incorrecta — " + rest + " intento" + (rest !== 1 ? "s" : "") + " restante" + (rest !== 1 ? "s" : "");
    }
  }
}

function toggleEye() {
  const inp = document.getElementById("passInput");
  const ico = document.getElementById("eyeIcon");
  if (inp.type === "password") {
    inp.type = "text";
    ico.innerHTML = '<line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>';
  } else {
    inp.type = "password";
    ico.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

// Verificar bloqueo al cargar
checkBloqueo();
</script>
